<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShowClock — Display</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700;800&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green:    #22c55e;
    --yellow:   #eab308;
    --red:      #ef4444;
    --bg:       #050608;
    --surface:  #0e1014;
    --text:     #f0f2f8;
    --muted:    #4b5265;
    --current-color: var(--green);
    --flash-rate: 1000ms;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    overflow: hidden;
    user-select: none;
  }

  /* ── Idle / no-signal screen ── */
  #idle-screen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: var(--bg);
    z-index: 10;
    transition: opacity 0.5s;
  }

  #idle-screen.hidden {
    opacity: 0;
    pointer-events: none;
  }

  #idle-screen .idle-icon {
    font-size: 48px;
    opacity: 0.3;
  }

  #idle-screen .idle-text {
    font-size: 18px;
    font-weight: 400;
    color: var(--muted);
    letter-spacing: 0.06em;
  }

  /* ── Main display ── */
  #display {
    position: fixed;
    inset: 0;
    display: grid;
    grid-template-rows: 1fr auto;
    padding: 48px;
    gap: 0;
    opacity: 0;
    transition: opacity 0.5s;
  }

  #display.visible { opacity: 1; }

  /* Center clock area */
  #clock-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    position: relative;
    padding-bottom: 16px;
  }

  #timer-name {
    font-size: clamp(20px, 3vw, 36px);
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
    max-width: 80vw;
    transition: color 0.4s;
  }

  #clock {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(100px, 22vw, 280px);
    font-weight: 800;
    line-height: 0.9;
    letter-spacing: -0.04em;
    color: var(--current-color);
    text-align: center;
    transition: color 0.4s;
    /* subtle glow matching current color */
    text-shadow:
      0 0 80px color-mix(in srgb, var(--current-color) 20%, transparent),
      0 0 160px color-mix(in srgb, var(--current-color) 8%, transparent);
  }

  #clock.flash {
    animation: display-flash var(--flash-rate) step-start infinite;
  }

  @keyframes display-flash {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.05; }
  }

  #status-badge {
    font-size: clamp(11px, 1.4vw, 16px);
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 6px 20px;
    border-radius: 40px;
    background: var(--surface);
    color: var(--muted);
    border: 1px solid #1e2230;
    transition: all 0.3s;
  }

  #status-badge.running {
    background: color-mix(in srgb, var(--current-color) 10%, transparent);
    color: var(--current-color);
    border-color: color-mix(in srgb, var(--current-color) 30%, transparent);
  }

  #status-badge.finished {
    background: color-mix(in srgb, var(--red) 10%, transparent);
    color: var(--red);
    border-color: color-mix(in srgb, var(--red) 30%, transparent);
  }

  /* ── Total time remaining (shown when subtimers active) ── */
  #total-remaining {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(13px, 1.6vw, 20px);
    font-weight: 400;
    color: var(--muted);
    letter-spacing: 0.06em;
    opacity: 0;
    transition: opacity 0.4s;
  }
  #total-remaining.visible { opacity: 1; }

  /* ── Notes panel ── */
  #notes-panel {
    width: 100%;
    max-width: 900px;
    max-height: 28vh;
    overflow-y: auto;
    margin: 0 auto;
    padding: 16px 24px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 12px;
    opacity: 0;
    transition: opacity 0.4s;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.15) transparent;
  }

  #notes-panel.has-content { opacity: 1; }

  #notes-panel::-webkit-scrollbar { width: 4px; }
  #notes-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

  /* Render Quill HTML output on the display */
  #notes-panel p, #notes-panel li {
    font-size: clamp(14px, 1.8vw, 22px);
    font-weight: 400;
    color: rgba(240,242,248,0.75);
    line-height: 1.6;
    text-align: left;
  }

  #notes-panel strong { color: rgba(240,242,248,0.95); font-weight: 700; }
  #notes-panel em    { font-style: italic; }
  #notes-panel u     { text-decoration: underline; }

  #notes-panel ul, #notes-panel ol {
    padding-left: 1.6em;
    margin: 2px 0;
    list-style: disc;
    list-style-position: outside;
  }

  #notes-panel ol { list-style: decimal; }

  #notes-panel li { margin-left: 0; }
  #notes-panel li::marker { color: var(--current-color); }

  /* Quill indent levels — markers move with the text */
  #notes-panel li.ql-indent-1 { margin-left: 3em; }
  #notes-panel li.ql-indent-2 { margin-left: 6em; }
  #notes-panel li.ql-indent-3 { margin-left: 9em; }
  #notes-panel li.ql-indent-4 { margin-left: 12em; }
  #notes-panel li.ql-indent-5 { margin-left: 15em; }
  #notes-panel li.ql-indent-6 { margin-left: 18em; }
  #notes-panel li.ql-indent-7 { margin-left: 21em; }
  #notes-panel li.ql-indent-8 { margin-left: 24em; }

  /* Remove the old padding-left indent rules */
  #notes-panel .ql-indent-1:not(li) { padding-left: 3em; }
  #notes-panel .ql-indent-2:not(li) { padding-left: 6em; }
  #notes-panel .ql-indent-3:not(li) { padding-left: 9em; }

  /* Alternating bullet styles per indent level */
  #notes-panel li.ql-indent-1,
  #notes-panel li.ql-indent-3,
  #notes-panel li.ql-indent-5,
  #notes-panel li.ql-indent-7 { list-style-type: circle; }

  #notes-panel li.ql-indent-2,
  #notes-panel li.ql-indent-4,
  #notes-panel li.ql-indent-6,
  #notes-panel li.ql-indent-8 { list-style-type: square; }

  #notes-panel p + p { margin-top: 4px; }

  /* ── Parent timer label (shown when subtimer is active) ── */
  #parent-label {
    font-size: clamp(14px, 2vw, 24px);
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
    opacity: 0;
    transition: opacity 0.4s;
  }

  #parent-label.visible { opacity: 1; }

  /* ── Overall progress bar (thin, above main bar) ── */
  #overall-progress-wrap {
    position: fixed;
    bottom: 10px;
    left: 0;
    right: 0;
    height: 4px;
    background: transparent;
  }

  #overall-progress-bar {
    height: 100%;
    background: rgba(255,255,255,0.2);
    width: 100%;
    transition: width 0.9s linear;
  }
  #progress-wrap {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 10px;
    background: var(--surface);
  }

  #progress-bar {
    height: 100%;
    background: var(--current-color);
    width: 100%;
    transition: width 0.9s linear, background 0.4s;
    box-shadow: 0 0 20px color-mix(in srgb, var(--current-color) 60%, transparent);
  }

  #progress-bar.flash {
    animation: bar-flash var(--flash-rate) step-start infinite;
  }

  @keyframes bar-flash {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.1; }
  }

  /* Queue indicator (small dots at top) */
  #queue-dots {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .q-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--muted);
    opacity: 0.3;
    transition: all 0.3s;
  }

  .q-dot.active {
    opacity: 1;
    background: var(--current-color);
    width: 24px;
    border-radius: 4px;
  }

  /* Connection status */
  #conn-status {
    position: fixed;
    top: 16px;
    right: 20px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
    opacity: 0.5;
  }

  #conn-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.3s;
  }

  #conn-dot.connected { background: var(--green); }

  /* ── Hand-raise ── */
  #handraise-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 40px;
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-size: clamp(13px, 1.6vw, 18px);
    font-weight: 700;
    padding: 10px 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.2s, border-color 0.2s, transform 0.15s;
  }
  #handraise-btn:hover { border-color: var(--accent); transform: translateY(-2px); }
  #handraise-btn.raised { background: #14301f; border-color: var(--green); color: var(--green); }

  /* Name prompt modal */
  #name-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 30;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  #name-modal.open { opacity: 1; pointer-events: all; }

  #name-modal-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px 32px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: min(400px, 90vw);
  }

  #name-modal-box h2 {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
  }

  #name-modal-box p {
    font-size: 13px;
    color: var(--muted);
    margin-top: -8px;
  }

  #name-input {
    background: #0e1014;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    padding: 10px 14px;
    outline: none;
    transition: border-color 0.15s;
  }
  #name-input:focus { border-color: var(--accent); }

  #name-modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

  .modal-btn {
    border-radius: 8px;
    border: 1px solid var(--border);
    cursor: pointer;
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 700;
    padding: 8px 20px;
    transition: all 0.15s;
  }
  .modal-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .modal-btn.primary:hover { opacity: 0.85; }
  .modal-btn.ghost { background: none; color: var(--muted); }
  .modal-btn.ghost:hover { color: var(--text); }

  /* Hand-raise overlay panel */
  #handraise-overlay {
    position: fixed;
    bottom: 70px;
    right: 24px;
    width: min(340px, 90vw);
    background: rgba(14,16,20,0.92);
    border: 1px solid var(--border);
    border-radius: 12px;
    backdrop-filter: blur(8px);
    z-index: 19;
    overflow: hidden;
    transform: translateY(20px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s, transform 0.3s;
  }
  #handraise-overlay.visible { opacity: 1; transform: translateY(0); pointer-events: all; }

  #handraise-overlay-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  #handraise-list {
    max-height: 280px;
    overflow-y: auto;
    padding: 8px 0;
  }

  .handraise-entry {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 16px;
    font-size: clamp(13px, 1.4vw, 16px);
    color: var(--text);
  }

  .handraise-position {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    width: 20px;
    text-align: center;
    flex-shrink: 0;
  }

  .handraise-entry:first-child .handraise-position { color: var(--green); }

  .handraise-name { flex: 1; font-weight: 600; }
</style>
</head>
<body>

<div id="idle-screen">
  <div class="idle-icon">⏱</div>
  <div class="idle-text">Waiting for signal…</div>
</div>

<div id="display">
  <div id="queue-dots"></div>

  <div id="clock-area">
    <div id="parent-label"></div>
    <div id="timer-name"></div>
    <div id="clock">--:--</div>
    <div id="total-remaining"></div>
    <div id="status-badge">IDLE</div>
    <div id="notes-panel"></div>
  </div>
</div>

<div id="progress-wrap">
  <div id="progress-bar"></div>
</div>

<div id="overall-progress-wrap">
  <div id="overall-progress-bar"></div>
</div>

<div id="conn-status">
  <div id="conn-dot"></div>
  <span id="conn-label">Connecting</span>
</div>

<!-- Hand-raise overlay -->
<div id="handraise-overlay">
  <div id="handraise-overlay-header">✋ Queue</div>
  <div id="handraise-list"></div>
</div>

<!-- Raise hand button -->
<div style="position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;z-index:20;">
  <button id="changename-btn" style="background:none;border:none;color:var(--muted);font-family:'Syne',sans-serif;font-size:11px;cursor:pointer;padding:0;text-decoration:underline;display:none;">change name</button>
  <button id="handraise-btn">✋ Raise Hand</button>
</div>

<!-- Name prompt modal -->
<div id="name-modal">
  <div id="name-modal-box">
    <h2>What's your name?</h2>
    <p>Enter your name to raise your hand. It will be saved for this browser.</p>
    <input type="text" id="name-input" placeholder="Your name" maxlength="60" autocomplete="off">
    <div id="name-modal-actions">
      <button class="modal-btn ghost" id="name-cancel">Cancel</button>
      <button class="modal-btn primary" id="name-confirm">Raise Hand</button>
    </div>
  </div>
</div>

<script>
let state = { timers: [], activeTimerIndex: null, activeSubtimerIndex: null };

// ── Hand-raise ───────────────────────────────────────────────────────────
let handQueue = [];
let myName = localStorage.getItem('showclock_name') || null;
let myHandRaised = false;

// Show change name button on load if name was previously manually entered
if (myName) {
  // Will be hidden again if Tailscale identity resolves
  document.getElementById('changename-btn').style.display = '';
}

function renderHandQueue() {
  const overlay  = document.getElementById('handraise-overlay');
  const list     = document.getElementById('handraise-list');
  const btn      = document.getElementById('handraise-btn');

  myHandRaised = myName ? !!handQueue.find(e => e.name.toLowerCase() === myName.toLowerCase()) : false;

  btn.textContent = myHandRaised ? '✋ Lower Hand' : '✋ Raise Hand';
  btn.classList.toggle('raised', myHandRaised);

  if (!handQueue.length) {
    overlay.classList.remove('visible');
    list.innerHTML = '';
    return;
  }

  overlay.classList.add('visible');
  list.innerHTML = handQueue.map((e, i) => `
    <div class="handraise-entry">
      <span class="handraise-position">${i + 1}</span>
      <span class="handraise-name">${esc(e.name)}</span>
    </div>
  `).join('');
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function resolveIdentity() {
  try {
    const res = await fetch('/api/identity');
    const data = await res.json();
    if (data.name) return data.name;
  } catch (e) { /* not behind tsidp */ }
  return null;
}

async function handleRaiseBtn() {
  if (myHandRaised) {
    // Lower hand
    ws.send(JSON.stringify({ action: 'lower_hand', name: myName }));
    return;
  }

  // Try to get identity
  if (!myName) {
    const tsName = await resolveIdentity();
    if (tsName) {
      myName = tsName;
      localStorage.setItem('showclock_name', myName);
    }
  }

  if (myName) {
    ws.send(JSON.stringify({ action: 'raise_hand', name: myName }));
  } else {
    // Show name prompt
    document.getElementById('name-modal').classList.add('open');
    setTimeout(() => document.getElementById('name-input').focus(), 50);
  }
}

document.getElementById('handraise-btn').addEventListener('click', handleRaiseBtn);

document.getElementById('name-confirm').addEventListener('click', () => {
  const val = document.getElementById('name-input').value.trim();
  if (!val) return;
  myName = val;
  localStorage.setItem('showclock_name', myName);
  document.getElementById('name-modal').classList.remove('open');
  document.getElementById('changename-btn').style.display = '';
  ws.send(JSON.stringify({ action: 'raise_hand', name: myName }));
});

document.getElementById('name-cancel').addEventListener('click', () => {
  document.getElementById('name-modal').classList.remove('open');
});

document.getElementById('name-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('name-confirm').click();
  if (e.key === 'Escape') document.getElementById('name-cancel').click();
});

// Pre-resolve Tailscale identity silently on load
resolveIdentity().then(name => {
  if (name && !myName) {
    myName = name;
    localStorage.setItem('showclock_name', myName);
  }
  // Always show change name if we have any name
  if (myName) {
    document.getElementById('changename-btn').style.display = '';
  }
});

document.getElementById('changename-btn').addEventListener('click', () => {
  if (myHandRaised && myName) {
    ws.send(JSON.stringify({ action: 'lower_hand', name: myName }));
  }
  const previousName = myName;
  myName = null;
  localStorage.removeItem('showclock_name');
  document.getElementById('name-modal').classList.add('open');
  // Pre-fill with current name so they can edit rather than retype
  setTimeout(() => {
    const inp = document.getElementById('name-input');
    inp.value = previousName || '';
    inp.focus();
    inp.select();
  }, 50);
});

// ── WebSocket ────────────────────────────────────────────────────────────
let ws;

function connect() {
  ws = new WebSocket(`ws://${location.host}`);

  ws.addEventListener('open', () => {
    document.getElementById('conn-dot').className   = 'connected';
    document.getElementById('conn-label').textContent = 'Live';
  });

  ws.addEventListener('close', () => {
    document.getElementById('conn-dot').className   = '';
    document.getElementById('conn-label').textContent = 'Reconnecting…';
    setTimeout(connect, 2000);
  });

  ws.addEventListener('message', e => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'state' || msg.type === 'tick') {
      state = { timers: msg.timers, activeTimerIndex: msg.activeTimerIndex, activeSubtimerIndex: msg.activeSubtimerIndex ?? null };
      render();
    } else if (msg.type === 'hand_queue') {
      handQueue = msg.queue || [];
      renderHandQueue();
    }
  });
}

connect();

// ── Helpers ──────────────────────────────────────────────────────────────
function fmt(s) {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

function getColor(t) {
  if (!t) return 'var(--green)';
  if (t.remaining <= t.redAt)    return 'var(--red)';
  if (t.remaining <= t.yellowAt) return 'var(--yellow)';
  return 'var(--green)';
}

// ── Render ───────────────────────────────────────────────────────────────
function render() {
  const { timers, activeTimerIndex, activeSubtimerIndex } = state;
  const t = activeTimerIndex !== null ? timers[activeTimerIndex] : null;

  const idle    = document.getElementById('idle-screen');
  const display = document.getElementById('display');

  if (!t) {
    idle.classList.remove('hidden');
    display.classList.remove('visible');
    return;
  }

  idle.classList.add('hidden');
  display.classList.add('visible');

  const sub = (activeSubtimerIndex !== null && t.subtimers && t.subtimers[activeSubtimerIndex])
    ? t.subtimers[activeSubtimerIndex] : null;

  // Determine what's ticking and what thresholds to use
  const active       = sub || t;
  const displayName  = sub ? sub.name : t.name;
  const parentName   = sub ? t.name : null;

  // Color based on active entity's thresholds
  const color = getColor(active);
  document.documentElement.style.setProperty('--current-color', color);
  document.documentElement.style.setProperty('--flash-rate', `${active.flashRate}ms`);

  // Parent label (only when subtimer is active)
  const parentLabelEl = document.getElementById('parent-label');
  if (parentName) {
    parentLabelEl.textContent = parentName;
    parentLabelEl.classList.add('visible');
  } else {
    parentLabelEl.classList.remove('visible');
  }

  // Timer name (subtimer name if active, else parent name)
  document.getElementById('timer-name').textContent = displayName;

  // Clock shows active entity's remaining
  const clockEl = document.getElementById('clock');
  clockEl.textContent = fmt(active.remaining);

  const shouldFlash = t.status === 'running' && active.remaining <= active.flashAt && active.remaining > 0;
  clockEl.classList.toggle('flash', shouldFlash);

  // Notes (always from parent)
  const notesEl = document.getElementById('notes-panel');
  let notesHtml = (t.message || '').trim();
  if (notesHtml.includes('&lt;') || notesHtml.includes('&amp;')) {
    const txt = document.createElement('textarea');
    txt.innerHTML = notesHtml;
    notesHtml = txt.value;
  }
  notesEl.innerHTML = notesHtml;
  notesEl.classList.toggle('has-content', notesHtml.length > 0 && notesHtml !== '<p><br></p>');

  // Total remaining (only shown when subtimers are active)
  const totalEl = document.getElementById('total-remaining');
  if (sub && t.subtimers.length > 0) {
    const parentRemaining = t.subtimers.reduce((sum, s) => sum + s.remaining, 0);
    totalEl.textContent = `Total Time Remaining: ${fmt(parentRemaining)}`;
    totalEl.classList.add('visible');
  } else {
    totalEl.textContent = '';
    totalEl.classList.remove('visible');
  }

  // Status badge
  const badge = document.getElementById('status-badge');
  badge.textContent = t.status.toUpperCase();
  badge.className   = t.status;

  // Main progress bar — active entity's own progress
  const activePct = active.duration > 0 ? (active.remaining / active.duration) * 100 : 0;
  const bar = document.getElementById('progress-bar');
  bar.style.width = `${activePct}%`;
  bar.classList.toggle('flash', shouldFlash);

  // Overall progress bar — parent timer's total progress (only visible when subtimers present)
  const overallBar = document.getElementById('overall-progress-bar');
  if (sub && t.duration > 0) {
    // Compute parent remaining as sum of subtimer remainings
    const parentRemaining = t.subtimers.reduce((sum, s) => sum + s.remaining, 0);
    const overallPct = (parentRemaining / t.duration) * 100;
    overallBar.style.width = `${overallPct}%`;
    overallBar.style.display = '';
  } else {
    overallBar.style.display = 'none';
  }

  // Queue dots (parent timers only)
  const dotsEl = document.getElementById('queue-dots');
  dotsEl.innerHTML = timers.map((_, i) =>
    `<div class="q-dot ${i === activeTimerIndex ? 'active' : ''}"></div>`
  ).join('');
}
</script>
</body>
</html>
