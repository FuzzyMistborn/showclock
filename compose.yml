services:
  showclock:
    build: .
    container_name: showclock
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      - PORT=3000
      - DB_PATH=/data/showclock.db
      # Optional: set a password to protect the operator page
      # - OPERATOR_PASSWORD=your-password-here
      # Optional: session lifetime in hours (default: 24)
      # - SESSION_TTL_HOURS=24
      # Optional: fix the internal WS auth token so it persists across restarts
      # - OPERATOR_SECRET=your-random-secret-here
      # Optional: set to true if running behind a TLS-terminating reverse proxy
      # Enables Secure cookie flag, HSTS header, and X-Forwarded-For trust
      # - TRUST_PROXY=true
    volumes:
      - showclock_data:/data

volumes:
  showclock_data: